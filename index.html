<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python x Pyscript</title>
    <link rel="stylesheet" href="styles.css">
<!DOCTYPE html>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="main.js"></script>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body{
            font-family: Lucida Console, monospace;
            background-color: rgb(16, 2, 21);
            color: blueviolet;

        }

    </style>

</head>
<body>
    <!-- Hacker-style background -->
    <div class="stars"></div>

    <div class="shooting-star"></div>
    <div class="shooting-star shooting-star-two"></div>
    <div class="shooting-star shooting-star-three"></div>

    <!-- ai work -->

    <h1>The Nickname Atlas of Southeast Asia</h1>

    <div>
         <h3 style="color: blueviolet;">Enter a Southeast Asian Country</h3>

         <select id="Countries" name="">
        <option>Please select a country.</option>
         <option value=" The Land of Unexpected Treasures (also known as the Abode of Peace)">Brunei</option>
         <option value="The Pearl of the Orient Seas">Philippines</option>
         <option value="The Golden Land (also called the Land of the Golden Pagoda)">Myanmar</option>
         <option value="The Land of the Blue Dragon (also called the Land of the Ascending Dragon)">Vietnam</option>
         <option value="The Kingdom of Wonder (also called the Land of the Khmer or Land of Angkor)">Cambodia</option>
         <option value=" The Emerald of the Equator (also known as the Land of a Thousand Islands or Sleeping Asian Tiger)">Indonesia</option>

         </select>
         <br>
         <input type="button" id="btn" py-click="output" value="Reveal Nickname">
         <br>
         <div id="result">
         </div>


    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
